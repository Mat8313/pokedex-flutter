    </g>
    <circle cx="512" cy="512" r="318" fill="none" stroke="#17171C" stroke-width="25.44"/>
    <circle cx="512" cy="512" r="114.47999999999999" fill="#17171C"/>
    <circle cx="512" cy="512" r="74.73" fill="#FFFFFF"/>
