name: Release

# Pousser un tag de version publie une Release avec l'APK et l'IPA :
#   git tag v1.0.0 && git push origin v1.0.0
# Le lancement manuel (onglet Actions) compile les deux fichiers sans publier :
# ils restent téléchargeables comme artefacts du run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    env:
      # Facultatifs : sans eux, l'APK est signé avec une clé de debug jetable,
      # différente à chaque run — il s'installe, mais une nouvelle version ne
      # pourra pas remplacer l'ancienne sans la désinstaller d'abord.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Tests
        run: flutter test

      - name: Installer la clé de signature
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Compiler l'APK
        run: flutter build apk --release

      - name: Nommer l'APK
        run: mv build/app/outputs/flutter-apk/app-release.apk "pokedex-${{ github.ref_name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: pokedex-*.apk

  ios:
    name: IPA iOS (non signée)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      # Sans compte développeur payant, on ne peut pas signer pour les autres :
      # l'IPA est livrée non signée, et c'est AltStore, SideStore ou Sideloadly
      # qui la signent sur l'appareil avec l'identifiant Apple de chacun.
      - name: Compiler l'application
        run: flutter build ios --release --no-codesign

      - name: Empaqueter l'IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qr "$GITHUB_WORKSPACE/pokedex-${{ github.ref_name }}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: pokedex-*.ipa

  release:
    name: Publier la Release
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            pokedex-*.apk
            pokedex-*.ipa
          generate_release_notes: true
          body: |
            ## Installer

            **Android** — télécharger `pokedex-${{ github.ref_name }}.apk` depuis le téléphone,
            l'ouvrir, et autoriser l'installation depuis cette source si Android le demande.

            **iPhone / iPad** — l'IPA n'est pas signée : l'installer avec
            [AltStore](https://altstore.io), [SideStore](https://sidestore.io) ou
            [Sideloadly](https://sideloadly.io), qui la signent avec votre identifiant Apple.
            Avec un compte gratuit, l'application est à re-signer tous les 7 jours.

            Détails dans le [README](https://github.com/${{ github.repository }}#installer).
